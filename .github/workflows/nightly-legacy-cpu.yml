name: Legacy CPU (no AVX2)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  sse2:
    name: SSE2-only startup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install QEMU user emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Fetch the pinned engine
        run: scripts/fetch-engine.sh
      - name: Run llama-server on a qemu64 (SSE2) CPU
        run: scripts/verify-no-avx2.sh
      - name: Build the core with tests
        run: |
          cargo fmt --all --check
          cargo test --workspace
      - name: Frontend checks
        run: |
          npm ci
          npm run check
          npm run test

  # A full 4 GB VM chat is a manual gate. QEMU user-mode proves startup only;
  # run the Linux clean-install tests on the reference machines
  # or a self-hosted legacy runner before a release.
